name: Build Wiki.js 3.1 image-link test package

on:
  # A later push runs only this isolated package test, without publishing a release.
  push:
    branches: [hj-3.1-image-links-test]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'hjmaier/wiki.js' && github.ref == 'refs/heads/hj-3.1-image-links-test'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17@sha256:748a18a54d3842d43bc156f0840d78029b8d349e0feca98c12b9c4ce3404a6b3
        env:
          POSTGRES_USER: wiki_build_test
          POSTGRES_PASSWORD: build_test_password
          POSTGRES_DB: wiki_build_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U wiki_build_test -d wiki_build_test"
          --health-interval 5s --health-timeout 5s --health-retries 12

    steps:
      - name: Check out the exact candidate that triggered this run
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: source
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26.13.0'
          package-manager-cache: false

      - name: Compile, typecheck and package Linux x64
        run: bash source/scripts/build-native-linux.sh "$GITHUB_WORKSPACE/source" "$GITHUB_WORKSPACE/native-output" "$GITHUB_SHA"

      - name: Start packaged application against fresh test database
        env:
          WIKI_TEST_DB_PORT: ${{ job.services.postgres.ports[5432] }}
        run: |
          mkdir "$RUNNER_TEMP/wiki-smoke"
          packages=(native-output/*.tar.gz)
          test "${#packages[@]}" -eq 1
          tar -xzf "${packages[0]}" -C "$RUNNER_TEMP/wiki-smoke"
          node source/scripts/smoke-wiki31.mjs "$RUNNER_TEMP/wiki-smoke" "$GITHUB_WORKSPACE/native-output/smoke.log"

      - name: Upload package, checksums and test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wiki-js-3.1-image-links-${{ github.sha }}-linux-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            native-output/*.tar.gz
            native-output/*.sha256
            native-output/*.build-info.txt
            native-output/smoke.log
            native-output/logs/
